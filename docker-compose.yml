version: '3.9'

services:
  # ── Answer Service ─────────────────────────────────────────────
  answer:
    build:
      context: .
      dockerfile: Dockerfile.answer
    ports:
      - "3000:3000"
    env_file: .env
    restart: unless-stopped
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Ingestion Service (Baileys) ────────────────────────────────
  ingestion:
    build:
      context: .
      dockerfile: Dockerfile.ingestion
    ports:
      - "3002:3002"
    env_file: .env
    restart: unless-stopped
    volumes:
      - baileys-auth:/app/.baileys-auth
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Transcription Service ──────────────────────────────────────
  transcription:
    build:
      context: .
      dockerfile: Dockerfile.transcription
    ports:
      - "3003:3003"
    env_file: .env
    restart: unless-stopped
    volumes:
      - recordings:/app/recordings

  # ── Scheduler ─────────────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.scheduler
    ports:
      - "3001:3001"
    env_file: .env
    restart: unless-stopped
    depends_on:
      - answer

  # ── Admin Dashboard ────────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "4000:3000"
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://answer:3000
    restart: unless-stopped

  # ── Redis (optional: for rate limiting / caching) ──────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  baileys-auth:
  recordings:
