services:
  - type: web
    name: whatsapp-ingestion
    runtime: docker
    dockerfilePath: Dockerfile.ingestion
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: openrouter/free
      - key: OPENAI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
